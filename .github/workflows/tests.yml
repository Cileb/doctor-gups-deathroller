# Runs the two-player simulation on every push and pull request.
name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leafo/gh-actions-lua@v10
        with:
          luaVersion: "5.3"
      - name: Syntax check
        run: for f in *.lua; do luac -p "$f"; done
      - name: Two-player simulation
        run: lua tests/harness.lua .
